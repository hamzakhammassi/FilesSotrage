name: Build JAR

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Steup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SBT launcher
        run: |
          curl -L -o sbt-launch.jar https://repo1.maven.org/maven2/org/scala-sbt/sbtlaunch/1.4.7/sbt-launch-1.4.7.jar -o sbt-launch.jar
          ls -lh sbt-launch.jar

      - name: Build with SBT
        run: java -jar sbt-launch.jar package