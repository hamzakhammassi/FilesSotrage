name: Build JAR

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Steup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Steup SBT
        uses: |
          coursier/setup-action@v3
          with:
            apps: sbt

      - name: Build with SBT
        run: sbt package